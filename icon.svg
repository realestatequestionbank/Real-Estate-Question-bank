<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4FB8FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>

    <filter id="insetShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset dx="0" dy="2" result="offsetBlur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="offsetBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="105" ry="105" fill="url(#bgGradient)" />

  <g stroke="white" stroke-width="38" fill="none" filter="url(#insetShadow)">
    
    <circle cx="256" cy="256" r="170" />

    <circle cx="256" cy="256" r="55" />
    
    <line x1="86" y1="256" x2="201" y2="256" />
    
    <line x1="311" y1="256" x2="426" y2="256" />
    
    <line x1="256" y1="311" x2="256" y2="426" />
  </g>
</svg>